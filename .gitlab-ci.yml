image: node:22-alpine

stages:
  - install
  - test
  - build
  - deploy

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"
  # Deploy defaults — override any of these in Settings → CI/CD → Variables.
  DEPLOY_PORT: "8000"
  DEPLOY_SSH_PORT: "22"
  PM2_APP_NAME: "portfolio"

# node_modules is shared through the cache, not artifacts — 26k files blows past
# the artifact upload limit. Jobs fall back to `npm ci` if the cache misses
# (cold runner, different runner, evicted key).
.node_cache: &node_cache
  key:
    files:
      - package-lock.json
    prefix: node
  paths:
    - .npm/
    - node_modules/
  policy: pull

.ensure_deps: &ensure_deps
  - test -d node_modules || npm ci --prefer-offline --no-audit --fund=false

install:
  stage: install
  cache:
    <<: *node_cache
    policy: pull-push
  script:
    - npm ci --prefer-offline --no-audit --fund=false

test:
  stage: test
  needs:
    - install
  cache: *node_cache
  script:
    - *ensure_deps
    - npm run lint
    - npm run type-check

build:
  stage: build
  needs:
    - install
    - test
  cache: *node_cache
  script:
    - *ensure_deps
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - .next/
    exclude:
      - .next/cache/**/*

deploy:
  stage: deploy
  needs:
    - build
  # Only the default branch deploys. Add `when: manual` for a button instead.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: http://$DEPLOY_HOST:$DEPLOY_PORT
  cache: []
  variables:
    # sshpass reads the password from $SSHPASS, so it never lands in the
    # process list or the job log the way `sshpass -p <secret>` would.
    SSHPASS: "$SSH_PASSWORD"
    SSH_OPTS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p $DEPLOY_SSH_PORT"
  before_script:
    - apk add --no-cache openssh-client rsync sshpass
  script:
    - sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
    # Ship the compiled output and the files `next start` needs at runtime.
    - rsync -az --delete -e "sshpass -e ssh $SSH_OPTS" .next/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.next/"
    - rsync -az --delete -e "sshpass -e ssh $SSH_OPTS" public/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/public/"
    - rsync -az -e "sshpass -e ssh $SSH_OPTS" package.json package-lock.json next.config.ts "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - |
      sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" sh -se <<EOF
      set -e
      # Non-interactive sh reads no .bashrc/.profile, so node installed via nvm
      # or a custom prefix is not on PATH. Probe the usual locations.
      export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\$PATH"
      [ -s "\$HOME/.nvm/nvm.sh" ] && . "\$HOME/.nvm/nvm.sh" || true
      if ! command -v npm > /dev/null 2>&1; then
        for d in "\$HOME/.nvm/versions/node"/*/bin "\$HOME/.local/share/fnm/node-versions"/*/installation/bin; do
          [ -d "\$d" ] && PATH="\$d:\$PATH" || true
        done
        export PATH
      fi
      command -v npm > /dev/null 2>&1 || { echo "ERROR: npm not found on the server. Install Node first."; exit 127; }
      command -v pm2 > /dev/null 2>&1 || { echo "ERROR: pm2 not found on the server. Run: sudo npm i -g pm2"; exit 127; }
      echo "Using node \$(node -v) / npm \$(npm -v)"
      cd '$DEPLOY_PATH'
      npm ci --omit=dev --no-audit --fund=false
      if pm2 describe '$PM2_APP_NAME' > /dev/null 2>&1; then
        PORT='$DEPLOY_PORT' pm2 restart '$PM2_APP_NAME' --update-env
      else
        PORT='$DEPLOY_PORT' pm2 start npm --name '$PM2_APP_NAME' -- run start
      fi
      pm2 save
      EOF
