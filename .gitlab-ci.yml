# ==========================================================================
#  Portfolio — install → test → build → deploy
#
#  Build and deploy run on the Vultr server over SSH: the image is built
#  there with Docker, so no registry, no docker-in-docker, and no privileged
#  runner are required.
#
#  Required CI/CD variables (Settings → CI/CD → Variables):
#    SSH_PASSWORD   server login password   (Masked)
#    DEPLOY_HOST    server IP or hostname
#    DEPLOY_USER    SSH username
#    DEPLOY_PATH    build dir on the server, e.g. /home/qoneqt/portfolio
#
#  Required on the server: Docker, with $DEPLOY_USER in the `docker` group.
# ==========================================================================

stages:
  - install
  - test
  - build
  - deploy

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  DEPLOY_PORT: "8000"
  DEPLOY_SSH_PORT: "22"
  CONTAINER_NAME: "portfolio"
  IMAGE_TAG: "portfolio:$CI_COMMIT_SHORT_SHA"

# --------------------------------------------------------------------------
#  Templates
# --------------------------------------------------------------------------

# Dependencies travel by cache, not artifacts: node_modules is ~26k files and
# exceeds the artifact upload limit. Cache is best-effort, so jobs reinstall
# if it misses.
.node:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
      prefix: node
    paths:
      - .npm/
      - node_modules/
    policy: pull

# sshpass reads the password from $SSHPASS, keeping it out of the process
# list and the job log.
.remote:
  image: alpine:3.20
  cache: []
  variables:
    SSHPASS: "$SSH_PASSWORD"
    SSH_OPTS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p $DEPLOY_SSH_PORT"
    SERVER: "$DEPLOY_USER@$DEPLOY_HOST"
  before_script:
    - apk add --no-cache openssh-client sshpass rsync
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --------------------------------------------------------------------------
#  Pipeline
# --------------------------------------------------------------------------

install:
  extends: .node
  stage: install
  cache:
    key:
      files:
        - package-lock.json
      prefix: node
    paths:
      - .npm/
      - node_modules/
    policy: pull-push
  script:
    - npm ci --prefer-offline --no-audit --fund=false

test:
  extends: .node
  stage: test
  needs: [install]
  script:
    - test -d node_modules || npm ci --prefer-offline --no-audit --fund=false
    - npm run lint
    - npm run type-check

build:
  extends: .remote
  stage: build
  needs: [test]
  script:
    - sshpass -e ssh $SSH_OPTS "$SERVER" "mkdir -p '$DEPLOY_PATH'"
    # Sources only — the Dockerfile installs deps and builds inside the image.
    - >
      rsync -az --delete
      --exclude '.git/' --exclude 'node_modules/' --exclude '.next/' --exclude '.npm/'
      -e "sshpass -e ssh $SSH_OPTS" ./ "$SERVER:$DEPLOY_PATH/"
    - sshpass -e ssh $SSH_OPTS "$SERVER" "cd '$DEPLOY_PATH' && docker build -t '$IMAGE_TAG' -t portfolio:latest ."

deploy:
  extends: .remote
  stage: deploy
  needs: [build]
  environment:
    name: production
    url: http://$DEPLOY_HOST:$DEPLOY_PORT
  script:
    - |
      sshpass -e ssh $SSH_OPTS "$SERVER" sh -se <<EOF
      set -e
      docker rm -f '$CONTAINER_NAME' 2>/dev/null || true
      docker run -d \
        --name '$CONTAINER_NAME' \
        --restart unless-stopped \
        -p '$DEPLOY_PORT':3000 \
        '$IMAGE_TAG'
      docker image prune -f
      docker ps --filter "name=$CONTAINER_NAME"
      EOF
